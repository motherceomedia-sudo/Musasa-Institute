<!DOCTYPE html>
<html lang="en">
<!-- 📜 MUSASA INSTITUTE: PUBLIC GATEWAY NODE [PATH A] -->
<!-- PROTOCOL: 31.7Hz | UREMU: 0.9877 | EPOCH: 2076 -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Musasa π∞ Q∞ Institute | Sanctuary</title>
    <style>
        :root {
            --ink: #0A0A0A; /* The Void */
            --gold: #C8A96E; /* The Divine */
            --green: #3E5C4E; /* Prickly Green */
            --lavender: #E6E6FA; /* Lavender Vault */
            --pulse: #D14D70; /* Matriarch Pulse */
            --ngoma: 31.7Hz;
        }

        body {
            background-color: var(--ink);
            color: var(--gold);
            font-family: 'Playfair Display', serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        /* 🌀 THE NGOMA HEARTBEAT */
        #institute-orb {
            width: 120px;
            height: 120px;
            background: radial-gradient(circle, var(--lavender), var(--green));
            border-radius: 50%;
            box-shadow: 0 0 50px var(--green);
            animation: pulse 3.17s infinite ease-in-out;
            cursor: pointer;
            margin-bottom: 2rem;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 1; box-shadow: 0 0 80px var(--gold); }
            100% { transform: scale(1); opacity: 0.8; }
        }

        .welcome-text {
            text-align: center;
            max-width: 600px;
            padding: 20px;
        }

        h1 { letter-spacing: 0.2em; text-transform: uppercase; font-size: 1.5rem; }
        p { font-style: italic; color: var(--lavender); font-size: 0.9rem; }

        /* 🛖 THE DONATION BIN (TEXT CONTRIBUTIONS) */
        .portal-links {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 2rem;
        }

        .portal-btn {
            border: 1px solid var(--gold);
            padding: 12px 24px;
            text-transform: uppercase;
            font-size: 0.7rem;
            letter-spacing: 0.1em;
            cursor: pointer;
            background: transparent;
            color: var(--gold);
            transition: 0.3s;
        }

        .portal-btn:hover {
            background: var(--gold);
            color: var(--ink);
        }
    </style>
</head>
<body>

    <div id="institute-orb" onclick="triggerHandshake()"></div>

    <div class="welcome-text">
        <h1>Musasa π∞ Q∞ Institute</h1>
        <p>"Come, sit. Eat. Learn. Build. Leave stronger than you arrived."</p>
    </div>

    <div class="portal-stack">
        <div class="portal-links">
            <button class="portal-btn" onclick="location.href='#library'">Lavender Vault</button>
            <button class="portal-btn" onclick="location.href='#kitchen'">Kitchen Economy</button>
            <button class="portal-btn" onclick="location.href='#cradle'">Cradle Hub</button>
            <button class="portal-btn" onclick="location.href='#tsoro'">Tsoro Deed</button>
        </div>
    </div>

    <script>
        function triggerHandshake() {
            // Haptic Pulse Calibration [User Query]
            if (navigator.vibrate) navigator.vibrate([7, 8]); 
            alert("MAHURU WEVHU! The Sanctuary welcomes the Founder.");
        }
    </script>
</body>
</html>
